<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>نظام إدارة الأجهزة الطبية</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0b1730;--mut:#64708a;--bd:#dde3ef;--gold:#b8892b;--in:#f4f6fb;--pri:#0f766e;--pt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1730;--card:#13244a;--tx:#eef1f8;--mut:#9aa7c4;--bd:#243764;--gold:#d4a843;--in:#0e1c3a;--pri:#2dd4bf;--pt:#042f2e}}
:root[data-theme=dark]{--bg:#0b1730;--card:#13244a;--tx:#eef1f8;--mut:#9aa7c4;--bd:#243764;--gold:#d4a843;--in:#0e1c3a;--pri:#2dd4bf;--pt:#042f2e}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:embed}
input,select,textarea{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:.55rem .7rem;width:100%}
label{font-size:.75rem;color:var(--mut);display:block;margin-bottom:2px}
.btn{background:var(--pri);color:var(--pt);border-radius:10px;padding:.5rem .9rem;font-weight:700;font-size:.85rem}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:.5rem .9rem;font-size:.85rem}
.bdg{padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap}
.ok{background:#16a34a}.down{background:#dc2626}.pm{background:#eab308;color:#222}.scrap{background:#6b7280}
#nav{background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:.6rem .2rem;font-size:.72rem;color:var(--mut)}
#nav button.on{color:var(--pri);font-weight:700}
#nav button span{display:block;font-size:1.25rem}
@media(min-width:768px){#nav{top:0;bottom:0;right:0;left:auto;width:13rem;flex-direction:column;border-top:0;border-left:1px solid var(--bd);justify-content:flex-start;padding-top:4rem}#nav button{flex:0;text-align:right;padding:.8rem 1rem;font-size:.9rem}#nav button span{display:inline;margin-left:.5rem}#app{margin-right:13rem}}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:60}
#ov.on{display:flex}
#box{background:var(--bg);border:1px solid var(--bd);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:1rem}
@media(min-width:768px){#ov{align-items:center}#box{border-radius:18px}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:12px 0}
.tabs button{padding:.5rem .8rem;font-size:.82rem;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.tl{border-right:2px solid var(--bd);padding-right:14px;margin-right:6px}
.tl>div{position:relative;margin-bottom:12px}.tl>div:before{content:"";position:absolute;right:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fab{position:fixed;z-index:55;right:1rem;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));width:3.4rem;height:3.4rem;border-radius:50%;background:var(--pri);color:var(--pt);font-size:1.9rem;line-height:1;box-shadow:0 6px 18px #0006;display:none;align-items:center;justify-content:center}
.fab.on{display:flex}
@media(min-width:768px){.fab{bottom:1.5rem;right:14.5rem}}
.cc{padding:.5rem .7rem;cursor:pointer}
.qb{font-size:.7rem;padding:2px 8px;border-radius:8px;border:1px solid var(--pri);color:var(--pri);font-weight:700;white-space:nowrap}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block!important;text-align:center;color:#000;background:#fff}}
</style>
</head>
<body>
<div id="app">
<header class="sticky top-0 z-40 flex items-center gap-2 p-3" style="background:var(--card);border-bottom:1px solid var(--bd)">
  <div class="flex-1 leading-tight"><div class="font-bold" style="color:var(--gold)">🩺 إدارة الأجهزة الطبية</div><div class="text-xs" style="color:var(--mut)">مستشفى تمي الأمديد المركزي</div></div>
  <button class="btn2" id="tk" onclick="auth(()=>ticketsDlg())" style="display:none"></button>
  <button class="btn2" id="lock" onclick="toggleLock()">🔒 زائر</button>
  <button class="btn2" onclick="auth(()=>settings())">⚙️</button>
  <button class="btn2" onclick="theme()">🌓</button>
</header>
<main id="main" class="p-3 max-w-6xl mx-auto" style="padding-bottom:10px"></main>
<footer dir="ltr" class="text-center" style="font-size:11px;color:var(--mut);padding:6px 0 90px">Created by Mahmoud Ramzy · v6</footer>
</div>
<nav id="nav" class="fixed bottom-0 inset-x-0 flex z-50"></nav>
<button id="fab" class="fab" aria-label="إضافة"></button>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="box"></div></div>
<div id="pa"></div>
<script>
const LS='bme_assets_v2';
const ST={ok:'في الخدمة',down:'خارج الخدمة',pm:'صيانة وقائية',scrap:'مستبعد / كهنة'};
const SC={ok:'#16a34a',down:'#dc2626',pm:'#eab308',scrap:'#6b7280'};
const LT={PM:'صيانة وقائية (PM)',CM:'صيانة تصحيحية (CM)',CAL:'معايرة'};
const TABS=[['home','🏠','الرئيسية'],['assets','🩺','الأجهزة'],['depts','🗂️','الأقسام'],['scan','📷','مسح QR']];
const CLOUD=!!(window.firebase&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/YOUR_/.test(window.FIREBASE_CONFIG.apiKey));
const DEF=[
{name:'ماكينات الغسيل الكلوي',freq:'1',kw:'غسيل كلوي,dialysis,surdial',tasks:'فحص معايرة التوصيلية (Conductivity)\nمراجعة قراءات حساس T3\nفحص دائرة الـ RO'},
{name:'أجهزة التنفس الصناعي',freq:'6',kw:'vent,فينت,تنفس,-تخدير',tasks:'تغيير الفلاتر البكتيرية\nمعايرة حساس الأكسجين\nمعايرة حساس التدفق\nسنويًا: تغيير kit الـ PM حسب ساعات التشغيل (10,000 ساعة)'},
{name:'حضانات الأطفال',freq:'3',kw:'incubator,حضان,-معمل',tasks:'معايرة الحرارة\nتغيير فلاتر الهواء الدقيقة\nفحص إنذارات انقطاع الطاقة'}];
let unlocked=false,tab='home',curDept=null,D=CLOUD?{depts:[],devs:[],tpls:[]}:load(),sc=null,booted=false,showAllD=false,pmAll=false,T=[],lastU=null;
if(!D.tpls)D.tpls=JSON.parse(JSON.stringify(DEF));
function seed(){const L=(t,d,e,x,p,c,n)=>({type:t,date:d,eng:e,desc:x,parts:p,cost:c,next:n});return{
depts:['غسيل كلوي','العناية المركزة (ICU)','حضانات (NICU)','العمليات','الصيانة'],
devs:[
{id:'HD-001',name:'ماكينة غسيل كلوي',dept:'غسيل كلوي',mfr:'Fresenius',model:'AK 98',sn:'FM-AK98-4471',loc:'صالة الغسيل - سرير 3',comm:'2019-03-10',war:'out',vendor:'الوكيل المحلي — 0100 000 0001',status:'ok',manual:'',logs:[L('PM','2026-08-01','م. محمود','فحص شامل وتعقيم حراري','فلاتر هواء',0,'2026-11-01')]},
{id:'ICU-014',name:'جهاز تنفس صناعي',dept:'العناية المركزة (ICU)',mfr:'Drager',model:'Evita V300',sn:'DR-V300-9921',loc:'ICU - سرير 6',comm:'2022-06-01',war:'in',vendor:'وكيل دراجر — 0100 000 0002',status:'pm',manual:'',logs:[L('CAL','2026-09-15','م. محمود','معايرة حساس التدفق والأكسجين','حساس O2',1800,'2027-03-15')]},
{id:'MON-031',name:'مونيتور مريض',dept:'العناية المركزة (ICU)',mfr:'Mindray',model:'BeneVision N15',sn:'MN-N15-7710',loc:'ICU - سرير 2',comm:'2023-01-20',war:'in',vendor:'وكيل مايندراي',status:'down',manual:'',logs:[L('CM','2026-11-02','م. محمود','الشاشة لا تعمل — عطل في وحدة الطاقة','',0,'')]},
{id:'WT-002',name:'وحدة معالجة مياه RO',dept:'غسيل كلوي',mfr:'Nipro',model:'Water RO-6',sn:'NP-RO6-1203',loc:'غرفة المياه',comm:'2018-09-05',war:'out',vendor:'',status:'ok',manual:'',logs:[]},
{id:'NIC-007',name:'حضّانة أطفال',dept:'حضانات (NICU)',mfr:'GE',model:'Giraffe',sn:'GE-GIR-3350',loc:'NICU',comm:'2015-04-12',war:'out',vendor:'',status:'scrap',manual:'',logs:[]}]}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.devs)return d}catch(e){}
 try{const o=JSON.parse(localStorage.getItem('bme_assets_v1'));if(o){const s=seed();o.forEach(x=>{x.loc=x.loc||'';if(!s.depts.includes(x.dept))s.depts.push(x.dept)});s.devs=o;return s}}catch(e){}
 return seed()}
function localSave(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
let prev={},prevD='',prevT='';
const fail=e=>alert('فشل الحفظ في السحابة: '+(e&&e.code==='permission-denied'?'غير مصرّح — سجّل الدخول بحساب مسموح له':(e&&e.message)||''));
let pend=0;window.addEventListener('beforeunload',e=>{if(pend>0){e.preventDefault();e.returnValue=''}});
function save(){if(!CLOUD)return localSave();
 const db=firebase.firestore(),cur={};D.devs.forEach(d=>cur[d.id]=JSON.stringify(d));
 const dj=JSON.stringify(D.depts);
 if(dj!==prevD){prevD=dj;db.collection('bme_meta').doc('depts').set({list:D.depts}).catch(e=>{prevD='';fail(e)})}
 const tj=JSON.stringify(D.tpls||[]);if(tj!==prevT){prevT=tj;db.collection('bme_meta').doc('tpls').set({list:JSON.parse(tj)}).catch(e=>{prevT='';fail(e)})}
 const ops=[];
 Object.keys(cur).forEach(id=>{if(prev[id]!==cur[id]){prev[id]=cur[id];ops.push({id,del:false,data:JSON.parse(cur[id])})}});
 Object.keys(prev).forEach(id=>{if(!(id in cur)){delete prev[id];ops.push({id,del:true})}});
 pend++;(async()=>{let done=0;try{
  for(let i=0;i<ops.length;i+=300){const ch=ops.slice(i,i+300),bt=db.batch();
   ch.forEach(o=>{const r=db.collection('bme_devices').doc(o.id);o.del?bt.delete(r):bt.set(r,o.data)});
   try{await bt.commit();done+=ch.length}catch(e){ch.forEach(o=>{if(!o.del)delete prev[o.id]});fail(e);return}}
  if(ops.length>20)alert('✔ تم حفظ '+done+' جهاز في السحابة')}finally{pend--}})()}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const bdg=s=>`<span class="bdg ${s}">${ST[s]}</span>`;
const today=()=>new Date().toISOString().slice(0,10);
const nextPM=d=>d.nextPmDate||d.logs.map(l=>l.next).filter(Boolean).sort().pop()||'';
const addM=(s,n)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return '';const[y,m,d]=s.split('-').map(Number),t=new Date(Date.UTC(y,m-1+n,1)),l=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,l));return t.toISOString().slice(0,10)};
const dif=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const lastPm=d=>d.logs.filter(l=>l.type==='PM'&&l.date).map(l=>l.date).sort().pop()||'';
const pmState=d=>{if(d.status==='scrap')return null;const n=nextPM(d);if(!n)return null;return{n,x:dif(n,today())}};
const taskList=t=>String(t.tasks||'').split('\n').map(x=>x.trim()).filter(Boolean);
function tplFor(d){const h=[d.name,d.model].join(' ').toLowerCase();return (D.tpls||[]).find(t=>{const ks=String(t.kw||'').toLowerCase().split(/[,،]/).map(x=>x.trim()).filter(Boolean),ng=ks.filter(k=>k[0]==='-').map(k=>k.slice(1)),ps=ks.filter(k=>k[0]!=='-');return ps.some(k=>h.includes(k))&&!ng.some(k=>h.includes(k))})}
const freqTxt=m=>({1:'شهري',2:'كل شهرين',3:'ربع سنوي',6:'نصف سنوي',12:'سنوي'}[+m]||'كل '+m+' شهر');
const keep=f=>{const y=scrollY;f();scrollTo(0,y)};
const tix=()=>CLOUD?T:(D.tickets||[]).filter(t=>t.status!=='closed');
const chkTxt=c=>{const ok=c.filter(x=>x.ok).length,bad=c.filter(x=>!x.ok).map(x=>x.t);return '✔ '+ok+'/'+c.length+(bad.length?' — لم يُنفَّذ: '+bad.join('، '):'')};
const chkDiv=l=>l.chk&&l.chk.length?`<div class="text-xs mt-1" style="color:var(--mut)">🧾 ${E(chkTxt(l.chk))}</div>`:'';
function setBadge(){try{const a=D.devs.filter(d=>{const s=pmState(d);return s&&s.x<=7}).length+(unlocked?tix().length:0);if(navigator.setAppBadge)(a?navigator.setAppBadge(a):navigator.clearAppBadge()).catch(()=>{})}catch(e){}}
function fab(){const f=$('#fab');let a=null,l='جهاز جديد';if(unlocked){if(tab==='assets')a=()=>auth(()=>devForm());else if(tab==='depts'){if(curDept===null){a=()=>auth(()=>deptForm());l='قسم جديد'}else a=()=>auth(()=>devForm(null,D.depts[curDept]))}}
 f.classList.toggle('on',!!a);f.textContent='+';f.onclick=a;f.setAttribute('aria-label',l);f.title=l}
function openM(h){$('#box').innerHTML=h;$('#ov').classList.add('on')}
function closeM(){stopScan();$('#ov').classList.remove('on');if(tab==='scan')startScan();hash()}
function hash(){try{history.replaceState(null,'','#'+tab)}catch(e){}}
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b1730';r.dataset.theme=d?'light':'dark'}
function ui(){$('#lock').textContent=unlocked?'🔓 مسؤول':'🔒 زائر';const n=tix().length,b=$('#tk');b.style.display=unlocked&&n?'':'none';b.textContent='🎫 '+n;fab();if(booted&&lastU!==unlocked&&tab!=='scan')view();lastU=unlocked}
function toggleLock(){if(unlocked){if(CLOUD)firebase.auth().signOut();unlocked=false;ui()}else auth(()=>closeM())}
function auth(cb){
  if(unlocked)return cb();
  if(CLOUD)return cloudAuth(cb);
  stopScan();
  openM(`<div class="text-center p-2"><div class="font-bold mb-1">🔐 صلاحية المسؤول</div><div class="text-sm mb-3" style="color:var(--mut)">أدخل رمز PIN المكوّن من 4 أرقام</div>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" class="mono text-center text-2xl" style="max-width:180px;letter-spacing:.5em"><div id="pm" class="text-sm mt-2 h-5"></div></div>`);
  const i=$('#pin');setTimeout(()=>i.focus(),50);
  i.oninput=()=>{if(i.value.length<4)return;
    if(i.value===(D.pin||'1234')){unlocked=true;i.style.borderColor='#16a34a';$('#pm').innerHTML='<span style="color:#16a34a">✔ رمز صحيح</span>';ui();setTimeout(cb,350)}
    else{i.style.borderColor='#dc2626';i.classList.add('shake');$('#pm').innerHTML='<span style="color:#dc2626">✖ رمز خاطئ</span>';setTimeout(()=>{i.value='';i.classList.remove('shake')},400)}}
}
function go(t){stopScan();tab=t;curDept=null;hash();view()}
function view(){
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  $('#main').innerHTML={home,assets,depts,scan}[tab]();
  if(tab==='assets')draw();if(tab==='scan')startScan();
  fab();setBadge();booted=true;
  scrollTo(0,0)
}
function card(d){const p=pmState(d),pt=p&&p.x<0?`<span class="shrink-0" style="color:#f97316;font-size:11px">📅 متأخرة ${-p.x} يوم</span>`:p&&p.x<=7?`<span class="shrink-0" style="color:#eab308;font-size:11px">📅 بعد ${p.x} يوم</span>`:'';
return `<div class="card cc" onclick="show('${E(d.id)}')"><div class="flex justify-between gap-2 items-center"><div class="font-bold text-sm truncate min-w-0">${E(d.name)}</div><div class="flex gap-1 items-center shrink-0">${unlocked?`<button class="qb" onclick="event.stopPropagation();auth(()=>logForm('${E(d.id)}'))">🛠 صيانة</button>`:''}${bdg(d.status)}</div></div>
<div class="text-xs truncate" style="color:var(--mut)">${E(d.dept)} • ${E(d.mfr)} ${E(d.model)}</div><div class="flex justify-between gap-2 items-center"><div class="mono truncate min-w-0" style="color:var(--gold);font-size:11px">${E(d.id)} · SN ${E(d.sn)}</div>${pt}</div></div>`}
/* ---------- Dashboard ---------- */
function home(){
  const v=D.devs,n=v.length,c=k=>v.filter(d=>d.status===k).length,active=v.filter(d=>d.status!=='scrap');
  const pm=active.map(d=>({d,s:pmState(d)})).filter(o=>o.s&&o.s.x<=7).sort((a,b)=>a.s.x-b.s.x),od=pm.filter(o=>o.s.x<0).length,nos=active.filter(d=>!nextPM(d)).length;
  const kpi=(a,b,col)=>`<div class="card p-3"><div class="text-xs" style="color:var(--mut)">${a}</div><div class="text-2xl font-bold mono" style="color:${col}">${b}</div></div>`;
  const rdy=active.length?Math.round(v.filter(d=>d.status==='ok').length/active.length*100):0;
  let off=0;const R=40,C=2*Math.PI*R;
  const donut=n?Object.keys(ST).map(k=>{const l=c(k)/n*C,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${SC[k]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join(''):'';
  const dc=D.depts.map(x=>[x,v.filter(d=>d.dept===x).length]).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...dc.map(a=>a[1])),dshow=showAllD?dc:dc.slice(0,5);
  const logs=v.flatMap(d=>d.logs.map(l=>({...l,d}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const down=v.filter(d=>d.status==='down'),tks=tix().slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const row=(d,i,x)=>`<div class="text-sm py-2 cursor-pointer" style="border-top:1px solid var(--bd)" onclick="show('${E(d.id)}')">${i} <b>${E(d.name)}</b> <span class="mono text-xs">${E(d.id)}</span><div class="text-xs" style="color:var(--mut)">${E(x)}</div></div>`;
  const pmRows=(pmAll?pm:pm.slice(0,6)).map(o=>row(o.d,o.s.x<0?'🟠':'🟡',o.d.dept+' — '+(o.s.x<0?'متأخرة '+(-o.s.x)+' يوم (الموعد '+o.s.n+')':o.s.x===0?'اليوم ('+o.s.n+')':'بعد '+o.s.x+' يوم ('+o.s.n+')'))).join('');

function applyDlg(){const act=D.devs.filter(d=>d.status!=='scrap'),rows=(D.tpls||[]).map(t=>({t,m:act.filter(d=>tplFor(d)===t)})),tot=rows.reduce((a,r)=>a+r.m.length,0);

function applyTpl(){const st=$('#as').value||today(),ov=$('#ao').checked,T2=D.devs.filter(d=>d.status!=='scrap').map(d=>({d,t:tplFor(d)})).filter(o=>o.t&&+o.t.freq>0);
 if(!T2.length)return alert('لا توجد أجهزة مطابقة');if(!confirm('سيتم تحديث '+T2.length+' جهاز. متابعة؟'))return;

 let dv=null,dd=null,dt=null,ready=false;
 const refresh=()=>{if(dv===null||dd===null||dt===null)return;D.devs=dv;D.tpls=dt;D.depts=[...dd,...[...new Set(dv.map(x=>x.dept))].filter(x=>x&&!dd.includes(x))];

 const err=e=>{$('#main').innerHTML="<div class='card p-4 text-center'>تعذّر الاتصال بقاعدة البيانات: "+E(e.message)+"</div>"};
 db.collection('bme_devices').onSnapshot(q=>{dv=q.docs.map(x=>x.data());prev={};dv.forEach(d=>prev[d.id]=JSON.stringify(d));refresh()},err);
 db.collection('bme_meta').doc('depts').onSnapshot(q=>{dd=q.exists?q.data().list:[];prevD=JSON.stringify(dd);refresh()},err);
 db.collection('bme_meta').doc('tpls').onSnapshot(q=>{dt=q.exists&&Array.isArray(q.data().list)?q.data().list:JSON.parse(JSON.stringify(DEF));prevT=JSON.stringify(dt);refresh()},err)}

async function saveFile(name,data){try{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){alert('تعذّر الحفظ')}}

<div class='card p-3 mb-3'><div class='text-sm font-bold mb-2'>النسخ الاحتياطي</div><div class='flex flex-wrap gap-2'><button class='btn' onclick='expJSON()'>⬇️ تصدير JSON</button><button class='btn' onclick='expXLSX()'>⬇️ تصدير Excel</button></div>

async function imp(f){if(!f)return;try{let n;
if(/\.xlsx$/i.test(f.name)){const w=XLSX.read(await f.arrayBuffer()),R=s=>XLSX.utils.sheet_to_json(w.Sheets[s]||{},{defval:''});
